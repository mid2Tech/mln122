<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MLN122 • Luyện thi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font: 12px Arial, sans-serif;
            color: #111;
            background: #eee;
            overflow: hidden;
        }

        .top {
            height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 14px 1px 8px;
            background: #f5f5f5;
            border: 1px solid #d3d3d3;
        }

        .brand {
            font: 18px Georgia, serif;
            letter-spacing: -1px;
            color: #222;
            width: 94px;
            flex: none;
            font-weight: bold;
        }

        .tag {
            font-size: 12px;
            font-weight: bold;
            color: #1c3475;
            white-space: nowrap;
        }

        .progress {
            height: 18px;
            flex: 1;
            border: 1px solid #c7c7c7;
            background: #e9e9e9;
            padding: 1px;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #11a22b, #42e35d);
            transition: width .2s;
        }

        .top select {
            font: 11px Arial;
            width: 175px;
            height: 21px;
            border: 1px solid #aaa;
            background: white;
            cursor: pointer;
        }

        .top .select {
            display: block;
            flex: none;
            color: #222;
            padding: 1px 4px;
        }

        .study-link {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            padding: 0 10px;
            border: 1px solid #1c3475;
            background: #fff;
            color: #1c3475;
            text-decoration: none;
            font: bold 11px Arial, sans-serif;
            white-space: nowrap;
            cursor: pointer;
        }

        .study-link:hover {
            background: #eaf0ff;
        }

        .save-indicator {
            font-size: 11px;
            color: #08742d;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .save-indicator.active {
            opacity: 1;
        }

        .layout {
            position: absolute;
            left: 14px;
            right: 14px;
            top: 38px;
            bottom: 34px;
            display: grid;
            grid-template-columns: 33.5% 1fr;
            padding: 0;
            border: 1px solid #d2d2d2;
            background: #eee;
        }

        .left {
            background: white;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 0;
            border-right: 1px solid #d2d2d2;
        }

        .lefthead {
            height: 27px;
            padding: 3px 10px;
            border-bottom: 1px solid #aaa;
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: flex-start;
            color: #183b7e;
        }

        .lefthead strong {
            font-size: 12px;
        }

        .answers {
            padding: 3px 4px;
            overflow: auto;
            flex: 1;
        }

        .hint {
            margin: 0 0 5px;
            color: #111;
            font-size: 11px;
        }

        .opt {
            display: flex;
            align-items: flex-start;
            gap: 3px;
            padding: 2px 3px;
            margin: 0;
            border: 0;
            border-radius: 0;
            cursor: pointer;
            background: white;
            color: #111;
            min-height: 25px;
        }

        .opt:hover {
            background: #f7f7f7;
        }

        .opt input {
            appearance: auto;
            accent-color: #1472bb;
            margin: 2px 2px 0 13px;
            width: 13px;
            height: 13px;
            cursor: pointer;
        }

        .opt span {
            font-size: 11px;
            line-height: 18px;
        }

        .opt.correct {
            background: #e1f6e8;
            color: #12652d;
            font-weight: bold;
        }

        .opt.wrong {
            background: #ffe2e2;
            color: #a00;
        }

        .feedback {
            font-size: 11px;
            min-height: 20px;
            padding: 4px 6px;
            margin: 4px 0 0;
            border-radius: 0;
            font-weight: bold;
            line-height: 1.4;
            white-space: pre-line;
        }

        .feedback.good {
            color: #08742d;
            background: #e5f8e9;
            border: 1px solid #a3e0b2;
        }

        .feedback.bad {
            color: #bd1111;
            background: #fff0f0;
            border: 1px solid #f5baba;
        }

        .nav {
            display: flex;
            gap: 4px;
            padding: 3px 4px;
            border-top: 1px solid #eee;
            height: 26px;
            align-items: center;
        }

        .nav button {
            padding: 1px 6px;
            font-size: 11px;
            border: 1px solid #bbb;
            border-radius: 0;
            background: #eee;
            color: #111;
            height: 20px;
        }

        .nav #reviewToggle {
            margin-left: 5px;
            color: #183b7e;
        }

        .question-nav {
            display: grid;
            grid-template-columns: repeat(10, minmax(20px, 1fr));
            align-content: start;
            gap: 3px;
            padding: 4px 5px 6px;
            border-top: 1px solid #ddd;
            max-height: 115px;
            overflow-y: auto;
            background: #fff;
        }

        .question-nav button {
            height: 21px;
            padding: 0;
            font-size: 10px;
            background: #f5f5f5;
            border: 1px solid #bbb;
        }

        .question-nav button.done {
            background: #d9f4e8;
            border-color: #79c89e;
        }

        .question-nav button.current {
            outline: 2px solid #3159a7;
            outline-offset: -2px;
            font-weight: bold;
        }

        .question-nav button.was-wrong {
            color: #b31d2b;
            font-weight: bold;
            background: #ffe8e8;
            border-color: #f1aeb5;
        }

        .question-nav button.was-right {
            color: #08742d;
            font-weight: bold;
            background: #d9f4e8;
            border-color: #79c89e;
        }

        button {
            font: 11px Arial;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 0;
            padding: 2px 8px;
            background: #eee;
            color: #111;
        }

        button:hover {
            background: #e5e5e5;
        }

        button.primary {
            background: #eee;
            color: #111;
            border-color: #aaa;
            font-weight: bold;
        }

        button:disabled {
            opacity: .4;
            cursor: default;
        }

        .right {
            position: relative;
            margin: 0;
            background: #efefef;
            border: 0;
            border-left: 5px solid #df1212;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .qhead {
            height: 0;
            overflow: hidden;
            padding: 0;
            border: 0;
        }

        .qcount {
            display: none;
        }

        .qbody {
            padding: 0;
            overflow: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            padding-bottom: 30px;
        }

        .card {
            width: min(85%, 850px);
            max-width: none;
            min-height: 220px;
            background: white;
            border: 1px solid #d4d4d4;
            border-radius: 0;
            padding: 14px 18px;
            box-shadow: none;
        }

        .qmeta {
            font-size: 11px;
            color: #1c3475;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .qtext {
            font-size: 13px;
            line-height: 19px;
            white-space: pre-line;
            margin: 0 0 14px;
            color: #111;
            font-weight: 500;
        }

        .status {
            display: none;
        }

        .question-options {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .qchoice {
            font: 12px Arial;
            display: flex;
            gap: 7px;
            align-items: flex-start;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 2px;
            border: 1px solid transparent;
        }

        .qchoice:hover {
            background: #f6f8fa;
            text-decoration: underline;
        }

        .qchoice input {
            margin-top: 2px;
            accent-color: #1472bb;
            cursor: pointer;
        }

        .qchoice.correct {
            background: #e1f6e8;
            color: #12652d;
            font-weight: bold;
            border-color: #a3e0b2;
        }

        .qchoice.wrong {
            background: #ffe2e2;
            color: #a00;
            border-color: #f5baba;
        }

        .extra-note-box {
            margin-top: 14px;
            padding: 8px 10px;
            background: #f9fbfd;
            border-left: 3px solid #1c3475;
            font-size: 11px;
            color: #333;
            line-height: 1.5;
            white-space: pre-line;
        }

        .extra-note-box strong {
            color: #183b7e;
        }

        .bottom {
            position: fixed;
            left: 18px;
            right: 18px;
            bottom: 4px;
            height: 26px;
            background: transparent;
            border: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .bottom button {
            font-size: 11px;
            background: #eee;
            height: 22px;
            padding: 1px 9px;
        }

        .keygrid {
            display: none;
        }

        .summary {
            position: fixed;
            inset: 0;
            background: #1420338a;
            display: none;
            place-items: center;
            padding: 18px;
            z-index: 100;
        }

        .summary.show {
            display: grid;
        }

        .modal {
            background: white;
            border: 1px solid #aaa;
            padding: 20px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .modal h2 {
            margin: 0 0 10px;
            font-size: 15px;
            color: #183b7e;
        }

        .modal p {
            color: #333;
            line-height: 1.5;
            font-size: 12px;
            margin: 0 0 14px;
        }

        .bigarrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 14px;
            color: #b0b0b0;
            font-size: 38px;
            font-family: Arial;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            padding: 4px 8px;
        }

        .bigarrow:hover {
            color: #3159a7;
        }

        .bigarrow.nextarrow {
            left: auto;
            right: 14px;
        }

        @media(max-width: 680px) {
            html,
            body {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .top {
                height: auto;
                min-height: 50px;
                position: sticky;
                top: 0;
                z-index: 4;
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                padding: 6px 8px;
            }

            .layout {
                position: static;
                display: flex;
                flex-direction: column;
                margin: 0;
                border: 0;
            }

            .left {
                border-right: 0;
                border-bottom: 1px solid #ccc;
            }

            .card {
                width: 95%;
            }

            .bigarrow {
                display: none;
            }

            .bottom {
                position: static;
                padding: 10px;
                justify-content: center;
                background: #f5f5f5;
                border-top: 1px solid #ddd;
            }

            .question-nav {
                max-height: 160px;
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="brand">MLN122</div>
        <div class="tag" id="tagline">are 60 questions, and your progress of answering is</div>
        <select id="exam" class="select" aria-label="Chọn bộ đề" title="Chọn bộ đề"></select>
        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>
        <span class="save-indicator" id="saveIndicator">✓ Đã lưu</span>
        <a class="study-link" href="MLN122-hoc-bai.html" target="_blank" rel="noopener" title="Mở chế độ xem tất cả đáp án và ghi chú">Học bài</a>
        <span id="proglabel" style="display:none">0%</span>
    </header>

    <main class="layout">
        <section class="left">
            <div class="lefthead">
                <strong>Answer</strong>
                <span id="chooseCount" style="color:#111;font-weight:normal;font-size:11px">(Choose 1 answer)</span>
            </div>
            <div class="answers">
                <p class="hint" id="hintText">Chọn đáp án của bạn:</p>
                <div id="options"></div>
                <div id="feedback" class="feedback"></div>
            </div>
            <div class="nav">
                <button id="prev">Back</button>
                <button id="next" class="primary">Next</button>
                <button id="reviewToggle" title="Chỉ duyệt các câu đã trả lời">Xem lại câu đã làm</button>
            </div>
            <div id="questionNav" class="question-nav" aria-label="Đi tới câu hỏi"></div>
        </section>

        <section class="right">
            <div class="qhead">
                <span class="qcount" id="qcount"></span>
                <div class="keygrid" id="keys"></div>
            </div>
            <div class="qbody">
                <article class="card">
                    <div class="qmeta" id="qmeta">Câu 1 / 60</div>
                    <p class="qtext" id="question"></p>
                    <div class="question-options" id="questionOptions"></div>
                    <div id="extraNoteContainer"></div>
                    <div class="status" id="qstatus"></div>
                </article>
            </div>
            <div class="bigarrow" id="leftArrow" title="Câu trước">‹</div>
            <div class="bigarrow nextarrow" id="rightArrow" title="Câu tiếp">›</div>
            <div class="bottom">
                <span id="scoreline" style="font-size:11px;color:#444;margin-right:auto;"></span>
                <button id="resetSetBtn" title="Xóa kết quả đã làm để làm lại đề này từ đầu">Làm lại đề</button>
                <button id="finish" class="primary">Nộp bài</button>
            </div>
        </section>
    </main>

    <div id="summary" class="summary">
        <div class="modal">
            <h2 id="sumtitle">Kết quả bài luyện</h2>
            <p id="sumtext"></p>
            <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
                <button id="retryWrong" class="primary">Làm lại câu sai</button>
                <button id="close">Tiếp tục xem lại</button>
                <button id="restart">Làm lại bộ đề</button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        const STORAGE_KEY = 'MLN122_APP_PERSISTENCE_V1';
        const $ = s => document.querySelector(s);
        const exam = $('#exam');

        let setIndex = 0;
        let index = 0;
        let answers = [];
        let reviewMode = false;
        let retryMode = false;
        let retryIndices = [];
        let advanceTimer = null;
        let saveTimeout = null;

        // Populate dropdown
        sets.forEach((s, i) => {
            const o = document.createElement('option');
            o.value = i;
            o.textContent = s.title + ' (' + s.questions.length + ' câu)';
            exam.append(o);
        });

        // LocalStorage Management
        function getStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                console.error('Storage read error:', e);
                return {};
            }
        }

        function saveStorage(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                showSaveIndicator();
            } catch (e) {
                console.error('Storage save error:', e);
            }
        }

        function showSaveIndicator() {
            const ind = $('#saveIndicator');
            if (ind) {
                ind.classList.add('active');
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    ind.classList.remove('active');
                }, 1200);
            }
        }

        function persistCurrentState() {
            const store = getStorage();
            if (!store.sets) store.sets = {};
            const setId = sets[setIndex].id;

            store.currentSetIndex = setIndex;
            store.sets[setId] = {
                index: index,
                answers: answers,
                reviewMode: reviewMode,
                retryMode: retryMode,
                retryIndices: retryIndices,
                updatedAt: Date.now()
            };
            saveStorage(store);
        }

        function loadSet(forceReset = false) {
            setIndex = +exam.value;
            const setId = sets[setIndex].id;
            const totalQ = sets[setIndex].questions.length;

            reviewMode = false;
            retryMode = false;
            retryIndices = [];

            if (forceReset) {
                answers = Array(totalQ).fill(null);
                index = 0;
                persistCurrentState();
            } else {
                const store = getStorage();
                const saved = (store.sets && store.sets[setId]) ? store.sets[setId] : null;

                if (saved && Array.isArray(saved.answers) && saved.answers.length === totalQ) {
                    answers = saved.answers;
                    index = (typeof saved.index === 'number' && saved.index >= 0 && saved.index < totalQ) ? saved.index : 0;
                    reviewMode = !!saved.reviewMode;
                    retryMode = !!saved.retryMode;
                    retryIndices = Array.isArray(saved.retryIndices) ? saved.retryIndices : [];
                } else {
                    answers = Array(totalQ).fill(null);
                    index = 0;
                }
            }
            render();
        }

        function answerKeys(q) {
            return String(q.answer).match(/[A-E]/g) || [];
        }

        function isMulti(q) {
            return answerKeys(q).length > 1;
        }

        function isAnswered(i) {
            const q = sets[setIndex].questions[i];
            const a = answers[i];
            return isMulti(q) ? Array.isArray(a) && a.length >= answerKeys(q).length : a !== null && a !== undefined;
        }

        function isCorrectAnswer(i) {
            const q = sets[setIndex].questions[i];
            const a = answers[i];
            const keys = answerKeys(q);
            if (isMulti(q)) {
                return Array.isArray(a) && a.length === keys.length && keys.every(k => a.includes(k)) && a.every(k => keys.includes(k));
            }
            return a === q.answer;
        }

        function reviewIndices() {
            return answers.map((_, i) => isAnswered(i) ? i : -1).filter(i => i >= 0);
        }

        function moveQuestion(step) {
            const qs = sets[setIndex].questions;
            if (reviewMode || retryMode) {
                const list = reviewMode ? reviewIndices() : retryIndices;
                if (!list.length) return;
                let pos = list.indexOf(index);
                if (pos < 0) pos = 0;
                pos = Math.max(0, Math.min(list.length - 1, pos + step));
                index = list[pos];
            } else {
                index = Math.max(0, Math.min(qs.length - 1, index + step));
            }
            persistCurrentState();
            render();
        }

        function render() {
            const qs = sets[setIndex].questions;
            const q = qs[index];
            const multi = isMulti(q);

            $('#chooseCount').textContent = multi ? `(Choose ${answerKeys(q).length} answers)` : '(Choose 1 answer)';
            $('#qcount').textContent = retryMode ? `Làm lại câu sai ${Math.max(1, retryIndices.indexOf(index) + 1)} / ${retryIndices.length}` : reviewMode ? `Xem lại ${Math.max(1, reviewIndices().indexOf(index) + 1)} / ${reviewIndices().length}` : `Câu ${index + 1} / ${qs.length}`;
            $('#qmeta').textContent = (retryMode ? `Làm lại câu sai • Câu ${index + 1} / ${qs.length}` : reviewMode ? `Xem lại • Câu ${index + 1} / ${qs.length}` : `Câu ${index + 1} / ${qs.length}`) + (q.globalNumber ? ` (Gốc: Câu ${q.globalNumber})` : '');
            
            $('#question').textContent = q.text;
            $('#options').innerHTML = '';
            $('#questionOptions').innerHTML = '';
            $('#feedback').textContent = '';
            $('#feedback').className = 'feedback';

            // Options rendering
            q.options.forEach(o => {
                const selected = multi ? (Array.isArray(answers[index]) && answers[index].includes(o.key)) : answers[index] === o.key;
                const answered = isAnswered(index);

                // Left pane button
                const lab = document.createElement('label');
                lab.className = 'opt';
                if (selected && answered) {
                    lab.classList.add(answerKeys(q).includes(o.key) ? 'correct' : 'wrong');
                }

                const radio = document.createElement('input');
                radio.type = multi ? 'checkbox' : 'radio';
                radio.name = multi ? 'answer-multi' : 'answer';
                radio.checked = selected;
                radio.addEventListener('change', () => choose(o.key));

                const tx = document.createElement('span');
                tx.textContent = o.key;
                lab.append(radio, tx);
                $('#options').append(lab);

                // Right pane full choices
                const qr = document.createElement('label');
                qr.className = 'qchoice';
                if (answered) {
                    if (answerKeys(q).includes(o.key)) {
                        qr.classList.add('correct');
                    } else if (selected) {
                        qr.classList.add('wrong');
                    }
                }

                const qradio = document.createElement('input');
                qradio.type = multi ? 'checkbox' : 'radio';
                qradio.name = multi ? 'answercopy-multi' : 'answercopy';
                qradio.checked = selected;
                qradio.addEventListener('change', () => choose(o.key));

                const qtxt = document.createElement('span');
                qtxt.textContent = o.key + '. ' + o.text;
                qr.append(qradio, qtxt);
                $('#questionOptions').append(qr);
            });

            // Extra note / alternative question phrasing
            const noteBox = $('#extraNoteContainer');
            noteBox.innerHTML = '';
            let noteContent = '';
            if (q.note) {
                noteContent += `• Giải thích/Công thức: ${q.note}\n`;
            }
            if (q.extra_note) {
                noteContent += `• ${q.extra_note}\n`;
            }
            if (noteContent.trim() && isAnswered(index)) {
                const box = document.createElement('div');
                box.className = 'extra-note-box';
                box.innerHTML = `<strong>Ghi chú / Kiểu hỏi khác:</strong><br>${noteContent.trim()}`;
                noteBox.append(box);
            }

            // Feedback
            if (multi && !isAnswered(index) && Array.isArray(answers[index])) {
                $('#feedback').textContent = `Đã chọn ${answers[index].length}/${answerKeys(q).length} phương án`;
            } else if (isAnswered(index)) {
                const ok = isCorrectAnswer(index);
                $('#feedback').className = 'feedback ' + (ok ? 'good' : 'bad');
                let fbText = ok ? '✓ Chính xác!' : '✗ Chưa đúng. Đáp án đúng: ' + answerKeys(q).join(', ') + '. ' + answerKeys(q).map(k => q.options.find(o => o.key === k)?.text || '').join('; ');
                $('#feedback').textContent = fbText;
            }

            $('#qstatus').textContent = isAnswered(index) ? 'Đã trả lời' : (Array.isArray(answers[index]) ? 'Đang chọn' : 'Chưa trả lời');

            const reviewList = reviewIndices();
            const activeList = reviewMode ? reviewList : retryMode ? retryIndices : null;

            $('#prev').disabled = activeList ? activeList.indexOf(index) <= 0 : index === 0;
            $('#next').disabled = activeList ? activeList.indexOf(index) >= activeList.length - 1 : index === qs.length - 1;
            $('#next').textContent = activeList ? 'Câu tiếp →' : 'Next';

            $('#reviewToggle').textContent = reviewMode ? 'Thoát xem lại' : 'Xem lại câu đã làm';
            $('#reviewToggle').disabled = retryMode || (!reviewMode && !reviewList.length);
            $('#reviewToggle').title = reviewMode ? 'Quay lại chế độ làm bài' : 'Chỉ duyệt các câu đã trả lời';

            // Question grid
            $('#questionNav').innerHTML = '';
            (retryMode ? retryIndices : qs.map((_, i) => i)).forEach(i => {
                const b = document.createElement('button');
                const done = isAnswered(i);
                const right = done && isCorrectAnswer(i);
                b.className = (done ? 'done ' : '') + (i === index ? 'current ' : '') + (done ? (right ? 'was-right' : 'was-wrong') : '');
                b.textContent = i + 1;
                b.title = 'Câu ' + (i + 1) + (done ? (right ? ' • Đúng' : ' • Sai') : (Array.isArray(answers[i]) ? ' • Đang chọn' : ' • Chưa làm'));
                b.setAttribute('aria-label', b.title);
                b.onclick = () => {
                    clearTimeout(advanceTimer);
                    index = i;
                    persistCurrentState();
                    render();
                };
                $('#questionNav').append(b);
            });

            // Progress bar and score
            const done = answers.reduce((n, _, i) => n + (isAnswered(i) ? 1 : 0), 0);
            const correct = answers.reduce((n, _, i) => n + (isAnswered(i) && isCorrectAnswer(i) ? 1 : 0), 0);
            const pct = Math.round(done / qs.length * 100);

            $('#bar').style.width = pct + '%';
            $('#proglabel').textContent = `${done}/${qs.length}`;
            $('#tagline').textContent = `are ${qs.length} questions, and your progress of answering is`;
            $('#scoreline').textContent = `Đã làm: ${done}/${qs.length} • Đúng: ${correct} (${done ? Math.round(correct / done * 100) : 0}%)`;
        }

        function choose(key) {
            clearTimeout(advanceTimer);
            const answeredIndex = index;
            const q = sets[setIndex].questions[answeredIndex];
            const multi = isMulti(q);

            if (multi) {
                let picked = Array.isArray(answers[answeredIndex]) ? [...answers[answeredIndex]] : [];
                picked = picked.includes(key) ? picked.filter(k => k !== key) : [...picked, key];
                answers[answeredIndex] = picked;
                persistCurrentState();
                if (picked.length < answerKeys(q).length) {
                    render();
                    return;
                }
            } else {
                answers[answeredIndex] = key;
                persistCurrentState();
            }

            const ok = isCorrectAnswer(answeredIndex);
            const resultText = ok ? '✓ Chính xác!' : '✗ Chưa đúng. Đáp án đúng: ' + answerKeys(q).join(', ') + '. ' + answerKeys(q).map(k => q.options.find(o => o.key === k)?.text || '').join('; ');

            if (reviewMode || retryMode) {
                const list = reviewMode ? reviewIndices() : retryIndices;
                const pos = list.indexOf(answeredIndex);
                if (pos >= 0 && pos < list.length - 1) {
                    index = list[pos + 1];
                }
            } else if (answeredIndex < sets[setIndex].questions.length - 1) {
                index = answeredIndex + 1;
            }

            persistCurrentState();
            render();

            $('#feedback').className = 'feedback ' + (ok ? 'good' : 'bad');
            $('#feedback').textContent = 'Câu ' + (answeredIndex + 1) + ': ' + resultText;
        }

        // Navigation handlers
        $('#prev').onclick = () => moveQuestion(-1);
        $('#next').onclick = () => moveQuestion(1);
        $('#leftArrow').onclick = () => moveQuestion(-1);
        $('#rightArrow').onclick = () => moveQuestion(1);

        $('#reviewToggle').onclick = () => {
            if (retryMode) return;
            if (reviewMode) {
                reviewMode = false;
            } else {
                const list = reviewIndices();
                if (!list.length) return;
                reviewMode = true;
                index = list[0];
            }
            persistCurrentState();
            render();
        };

        exam.onchange = () => {
            loadSet(false);
        };

        $('#resetSetBtn').onclick = () => {
            if (confirm(`Bạn có muốn xóa tiến trình và làm lại từ đầu bộ "${sets[setIndex].title}" không?`)) {
                loadSet(true);
            }
        };

        $('#finish').onclick = () => {
            const qs = sets[setIndex].questions;
            const done = answers.reduce((n, _, i) => n + (isAnswered(i) ? 1 : 0), 0);
            const correct = answers.reduce((n, _, i) => n + (isAnswered(i) && isCorrectAnswer(i) ? 1 : 0), 0);
            const wrong = retryMode ? retryIndices.filter(i => !isAnswered(i) || !isCorrectAnswer(i)) : answers.map((_, i) => i).filter(i => isAnswered(i) && !isCorrectAnswer(i));
            const retryCorrect = retryIndices.reduce((n, i) => n + (isAnswered(i) && isCorrectAnswer(i) ? 1 : 0), 0);

            $('#sumtitle').textContent = retryMode ? 'Kết quả làm lại' : 'Kết quả bài luyện';
            $('#sumtext').textContent = retryMode
                ? `Bạn làm đúng ${retryCorrect}/${retryIndices.length} câu sai. Còn ${wrong.length} câu cần làm lại.`
                : `${sets[setIndex].title}: Đúng ${correct}/${qs.length} câu (${Math.round(correct / qs.length * 100)}%). Bạn đã hoàn thành ${done}/${qs.length} câu. ${wrong.length ? `Có ${wrong.length} câu chưa đúng; bạn có thể chọn "Làm lại câu sai" để củng cố kiến thức.` : 'Chúc mừng! Bạn đã trả lời đúng tất cả các câu đã làm.'}`;

            $('#retryWrong').textContent = retryMode ? 'Làm lại câu còn sai' : 'Làm lại câu sai';
            $('#retryWrong').disabled = !wrong.length;
            $('#summary').classList.add('show');
        };

        $('#retryWrong').onclick = () => {
            const list = retryMode ? retryIndices.filter(i => !isAnswered(i) || !isCorrectAnswer(i)) : answers.map((_, i) => i).filter(i => isAnswered(i) && !isCorrectAnswer(i));
            if (!list.length) return;
            retryIndices = list;
            retryMode = true;
            reviewMode = false;
            list.forEach(i => answers[i] = null);
            index = list[0];
            persistCurrentState();
            $('#summary').classList.remove('show');
            render();
        };

        $('#close').onclick = () => $('#summary').classList.remove('show');

        $('#restart').onclick = () => {
            $('#summary').classList.remove('show');
            loadSet(true);
        };

        // Keyboard navigation
        document.addEventListener('keydown', e => {
            // Ignore if active element is select or input in modal
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName) && document.activeElement !== document.body) {
                return;
            }
            if (e.key === 'ArrowLeft') {
                moveQuestion(-1);
            } else if (e.key === 'ArrowRight') {
                moveQuestion(1);
            } else if (['a', 'b', 'c', 'd', 'e', 'A', 'B', 'C', 'D', 'E'].includes(e.key)) {
                choose(e.key.toUpperCase());
            }
        });

        // Initialize state on page load (restoring from localStorage if exists)
        function init() {
            const store = getStorage();
            if (typeof store.currentSetIndex === 'number' && store.currentSetIndex >= 0 && store.currentSetIndex < sets.length) {
                setIndex = store.currentSetIndex;
                exam.value = setIndex;
            }
            loadSet(false);
        }

        init();
    </script>
</body>

</html>
